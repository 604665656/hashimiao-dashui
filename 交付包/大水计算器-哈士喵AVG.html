<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大水计算器 · 哈士喵监察司 AVG</title>
<style>
:root{
  --paper:#f7f3ec; --ink:#3a3630; --sub:#8b8276; --line:rgba(90,78,62,.16);
  --blue:#5b8fa8; --blue-d:#3d6d87; --gold:#c19a5b; --red:#b8615a; --green:#6c9a76;
  --glass:rgba(250,247,241,.92); --shadow:0 12px 36px rgba(70,60,45,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:"PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",system-ui,sans-serif;
  color:var(--ink);background:#e9e3d9;user-select:none}
button{font-family:inherit}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:
  radial-gradient(900px 700px at 20% 10%,#f3ede3,transparent 60%),
  radial-gradient(800px 800px at 85% 90%,#e6e9e4,transparent 60%),#e7e1d6}
#frame{position:relative;width:min(100vw,560px);height:min(100dvh,1000px);overflow:hidden;
  background:#ded7cb;box-shadow:0 24px 80px rgba(50,42,32,.34)}
@media(min-width:700px){#frame{height:min(94dvh,940px);border-radius:20px}}

/* ---------- 舞台 ---------- */
#stage{position:absolute;inset:0;overflow:hidden}
#bgLayer,#cgLayer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .7s ease}
#bgLayer{z-index:1}
#cgLayer{z-index:4;opacity:0;pointer-events:none}
#cgLayer.show{opacity:1}
#vignette{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(180deg,rgba(28,24,18,.20) 0%,transparent 22%,transparent 54%,rgba(28,24,18,.40) 100%)}
#stageTint{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:.06;mix-blend-mode:multiply;
  background:linear-gradient(160deg,#8fb6c9,#e8d9bb)}
#pet{position:absolute;z-index:5;left:50%;bottom:30%;width:250px;transform:translateX(-50%);
  filter:drop-shadow(0 12px 18px rgba(50,40,28,.32));cursor:pointer;touch-action:none;
  animation:float 3.6s ease-in-out infinite;transition:filter .25s,bottom .4s ease}
#pet img{width:100%;display:block;transition:opacity .28s;
  filter:drop-shadow(0 0 1.5px rgba(255,255,255,.95)) drop-shadow(0 0 3px rgba(80,66,48,.3))}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -9px}}
#pet.speaking{filter:drop-shadow(0 12px 24px rgba(70,110,135,.5)) brightness(1.04)}
#pet.pat{animation:pat .45s ease-in-out 2}
@keyframes pat{0%,100%{rotate:0deg;scale:1}50%{rotate:-5deg;scale:1.04}}
#petTag{position:absolute;z-index:6;left:50%;bottom:calc(30% - 26px);transform:translateX(-50%);
  white-space:nowrap;font-size:10px;font-weight:700;color:#fff;letter-spacing:.05em;
  background:rgba(61,109,135,.88);padding:4px 12px;border-radius:99px;box-shadow:0 4px 12px rgba(0,0,0,.16)}

/* ---------- HUD ---------- */
#hud{position:absolute;z-index:8;left:0;right:0;top:0;padding:12px 14px;display:flex;flex-wrap:wrap;gap:7px;
  align-items:center;background:linear-gradient(180deg,rgba(38,34,27,.42),transparent);pointer-events:none}
.hchip{font-size:10.5px;font-weight:700;color:#fff;background:rgba(40,36,29,.48);
  border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:5px 10px;backdrop-filter:blur(6px);
  display:flex;align-items:center;gap:5px;pointer-events:auto}
.hchip b{font-weight:800;color:#ffe9b8}
#hudRight{margin-left:auto;display:flex;gap:6px;pointer-events:auto}
.hbtn{width:30px;height:30px;border-radius:10px;border:1px solid rgba(255,255,255,.25);
  background:rgba(40,36,29,.48);color:#fff;font-size:14px;cursor:pointer;backdrop-filter:blur(6px);
  display:grid;place-items:center;transition:.2s}
.hbtn:hover{background:rgba(61,109,135,.8);transform:translateY(-1px)}
#kpiBar{position:absolute;z-index:8;left:14px;right:14px;top:52px;height:5px;border-radius:9px;
  background:rgba(255,255,255,.35);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#kpiFill{height:100%;width:0;background:linear-gradient(90deg,#7fc3d8,#5b8fa8,#6c9a76);
  border-radius:9px;transition:width .6s ease}

/* ---------- 对话框 ---------- */
#dialogue{position:absolute;z-index:10;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:9px;
  background:linear-gradient(180deg,transparent,rgba(24,22,18,.34) 16%,rgba(24,22,18,.34) 100%);pointer-events:none}
#dialogue>*{pointer-events:auto}
#speaker{display:inline-flex;align-items:center;gap:7px;align-self:flex-start;
  font-size:12px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--blue-d),#7aa9bf);
  padding:6px 15px;border-radius:99px 99px 99px 4px;box-shadow:0 5px 14px rgba(0,0,0,.2)}
#speaker small{font-weight:600;opacity:.8;font-size:10px}
#textbox{background:var(--glass);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.7);
  border-radius:16px;padding:14px 16px;min-height:96px;box-shadow:var(--shadow);cursor:pointer}
#text{font-size:14.5px;line-height:1.85;letter-spacing:.01em;min-height:52px;white-space:pre-wrap}
#text .em{color:var(--blue-d);font-weight:800}
#text .gold{color:#a97c34;font-weight:800}
#hint{font-size:10px;color:var(--sub);text-align:right;margin-top:6px;height:12px}
#hint.blink{animation:bl 1.1s infinite}
@keyframes bl{50%{opacity:.25}}
#choices{display:flex;flex-direction:column;gap:6px;max-height:min(34dvh,280px);overflow-y:auto;scrollbar-width:thin}
.choice{width:100%;text-align:left;border:1px solid rgba(255,255,255,.75);border-radius:13px;
  background:var(--glass);backdrop-filter:blur(12px);padding:9px 14px;font-size:12.5px;font-weight:700;
  color:var(--ink);cursor:pointer;box-shadow:0 5px 16px rgba(60,50,36,.14);transition:.18s;
  display:flex;align-items:center;gap:9px;line-height:1.45}
.choice:hover{transform:translateX(4px);background:#fff;border-color:var(--blue)}
.choice .ic{font-size:15px;flex:none}
.choice .tail{margin-left:auto;font-size:10px;color:var(--sub);font-weight:600;flex:none}
.choice.warn{border-color:rgba(182,97,90,.35);color:#8c4a44}
.choice.primary{background:linear-gradient(135deg,rgba(91,143,168,.95),rgba(122,169,191,.95));color:#fff;border-color:transparent}
#toolrow{display:flex;gap:6px;justify-content:flex-end}
.tool{font-size:10.5px;font-weight:700;color:#fff;background:rgba(40,36,29,.5);border:1px solid rgba(255,255,255,.2);
  border-radius:99px;padding:5px 11px;cursor:pointer;backdrop-filter:blur(6px)}
.tool.on{background:var(--gold);border-color:transparent}

/* ---------- 抽屉 ---------- */
#drawer{position:absolute;z-index:20;inset:0;background:rgba(30,27,22,.5);display:none;backdrop-filter:blur(3px)}
#drawer.show{display:flex}
#drawerBox{margin-left:auto;width:min(88%,420px);height:100%;background:var(--paper);
  box-shadow:-12px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;animation:slide .28s ease}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
.dhead{padding:18px 18px 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.dhead b{font-size:15px}.dhead .x{margin-left:auto;border:0;background:none;font-size:20px;color:var(--sub);cursor:pointer}
.dtabs{display:flex;gap:6px;padding:10px 14px;overflow-x:auto;border-bottom:1px solid var(--line)}
.dtab{font-size:11px;font-weight:700;padding:6px 12px;border-radius:99px;border:1px solid var(--line);
  background:#fff;color:var(--sub);cursor:pointer;white-space:nowrap}
.dtab.on{background:var(--blue-d);color:#fff;border-color:transparent}
.dbody{flex:1;overflow-y:auto;padding:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:0 3px 10px rgba(80,66,48,.06)}
.card h4{margin:0 0 6px;font-size:13px}.card p{margin:0;font-size:11.5px;line-height:1.8;color:var(--sub)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.gitem{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative;cursor:pointer}
.gitem img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#e8e1d5}
.gitem.locked img{filter:grayscale(1) brightness(1.15);opacity:.35}
.gitem .cap{font-size:10px;font-weight:700;padding:6px 8px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gitem .lock{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;color:#a89e8e}
.qitem{font-size:12px;line-height:1.8;padding:11px 13px;background:#fff;border:1px solid var(--line);
  border-left:3px solid var(--blue);border-radius:0 12px 12px 0;margin-bottom:9px}
.qitem time{display:block;font-size:10px;color:var(--sub);margin-top:5px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;font-weight:800;margin-bottom:6px;color:#5d5548}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;
  font-size:12.5px;font-family:inherit;background:#fff;color:var(--ink)}
.field .hint{font-size:10px;color:var(--sub);margin-top:5px;line-height:1.6}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:#fff;
  color:var(--sub);cursor:pointer}
.chip.on{background:var(--blue-d);color:#fff;border-color:transparent;font-weight:700}
.btn{border:0;border-radius:11px;padding:10px 14px;font-size:12px;font-weight:700;cursor:pointer;background:#e9f0f3;color:var(--blue-d)}
.btn.primary{background:linear-gradient(135deg,var(--blue-d),#7aa9bf);color:#fff}
.btn.warn{background:#f7e7df;color:#9a534c}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--sub)}
.btnrow{display:flex;gap:8px;margin-top:12px}.btnrow .btn{flex:1}
.slot{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:12px}
.slot:last-child{border:0}
.slot .meta{flex:1;min-width:0}.slot .meta b{display:block;font-size:12px}.slot .meta span{font-size:10px;color:var(--sub)}
.empty{font-size:12px;color:var(--sub);text-align:center;padding:26px 0;line-height:1.8}

/* ---------- 弹层 ---------- */
#mask{position:absolute;z-index:40;inset:0;background:rgba(26,23,19,.62);backdrop-filter:blur(5px);
  display:none;align-items:center;justify-content:center;padding:16px}
#mask.show{display:flex}
.modal{width:100%;max-height:88%;overflow-y:auto;background:var(--paper);border-radius:20px;padding:20px;
  box-shadow:0 26px 70px rgba(0,0,0,.35);animation:pop .3s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{transform:scale(.9) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.mtitle{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.msub{font-size:10.5px;color:var(--sub);margin-bottom:14px}
.notice{background:repeating-linear-gradient(0deg,#fffdf7,#fffdf7 25px,#f5efe2 26px);
  border:2px solid #e2d3b4;border-radius:13px;padding:14px;position:relative;overflow:hidden}
.notice .stamp{position:absolute;right:6px;top:62px;border:3px solid var(--red);color:var(--red);
  font-size:14px;font-weight:900;padding:5px 8px;border-radius:6px;transform:rotate(-14deg);opacity:.82}
.photo{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:9px;display:block;border:1px solid #ded0b2;background:#eee}
.nline{font-size:11.5px;line-height:1.9;color:#594b34}
.verdict{margin-top:9px;padding:10px 12px;background:#fbf0e2;border-left:3px solid var(--gold);
  font-size:11.5px;line-height:1.75;color:#7d5c2c;border-radius:0 8px 8px 0}
.endcard{text-align:center}
.endcard .ecg{width:100%;max-width:250px;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:3px solid #fff;
  box-shadow:var(--shadow);margin:0 auto 12px;display:block}
.endcard .erank{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.16em;color:#fff;
  background:var(--gold);padding:4px 12px;border-radius:99px}
.endcard h2{font-size:22px;margin:10px 0 6px;letter-spacing:.04em}
.endcard .ejudge{font-size:12px;line-height:1.9;color:#5d5548;margin:8px 0}
.endstats{display:flex;justify-content:center;gap:16px;font-size:11px;color:var(--sub);margin:10px 0}
.endstats b{display:block;font-size:18px;color:var(--blue-d)}
#toast{position:absolute;z-index:60;left:50%;bottom:34%;transform:translate(-50%,14px);opacity:0;
  background:rgba(38,34,27,.92);color:#fff;font-size:11.5px;padding:10px 17px;border-radius:99px;
  pointer-events:none;transition:.3s;max-width:86%;text-align:center;box-shadow:0 8px 20px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#fade{position:absolute;z-index:35;inset:0;background:#1e1b16;opacity:0;pointer-events:none;transition:opacity .45s}
#fade.show{opacity:1}
</style>
</head>
<body>
<div id="app"><div id="frame">

  <div id="stage">
    <img id="bgLayer" alt="">
    <div id="vignette"></div><div id="stageTint"></div>
    <img id="cgLayer" alt="">
    <div id="pet"><img id="petImg" alt="哈士喵"></div>
    <div id="petTag">大水监察司 · 今日 0%</div>

    <div id="hud">
      <div class="hchip">🕒 <b id="hClock">--:--</b> <span id="hDate" style="opacity:.75"></span></div>
      <div class="hchip" id="hLoc" title="点我改位置">📍 定位中</div>
      <div class="hchip" id="hWeather">🌤 读取中</div>
      <div class="hchip" id="hMood">💭 通透</div>
      <div class="hchip">💧 <b id="hMl">0</b>/<span id="hGoal">1700</span>ml</div>
      <div class="hchip" id="hScoreChip" title="防作弊冷却与今日积分">🏆 <b id="hScore">0</b>分 · <span id="hCd">可打卡</span></div>
      <div id="hudRight">
        <button class="hbtn" id="bQuick" title="快捷记录">💧</button>
        <button class="hbtn" id="bDrawer" title="菜单">☰</button>
      </div>
    </div>
    <div id="kpiBar"><div id="kpiFill"></div></div>
  </div>

  <div id="dialogue">
    <div id="speaker">哈士喵 <small>大水监察司</small></div>
    <div id="textbox"><div id="text"></div><div id="hint">▼ 点击继续</div></div>
    <div id="choices"></div>
    <div id="toolrow">
      <button class="tool" id="tAuto">自动</button>
      <button class="tool" id="tSkip">跳过</button>
      <button class="tool" id="tLog">历史</button>
      <button class="tool" id="tSave">存档</button>
      <button class="tool" id="tBoard">🏆 排行</button>
      <button class="tool" id="tShare">📤 打卡</button>
    </div>
  </div>

  <div id="fade"></div>
  <div id="toast"></div>

  <div id="drawer"><div id="drawerBox">
    <div class="dhead"><b>📁 大水档案</b><button class="x" id="dClose">×</button></div>
    <div class="dtabs" id="dTabs"></div>
    <div class="dbody" id="dBody"></div>
  </div></div>

  <div id="mask"><div class="modal" id="modalBox"></div></div>
</div></div>

/* 展平所有区县级叶子，供最近邻匹配 */
let _geoLeaves = null;
function geoLeaves(){
  if(_geoLeaves) return _geoLeaves;
  const out=[];
  GEO.tree.forEach((p,pi)=>p[3].forEach((c,ci)=>{
    (c[3]||[]).forEach((d,di)=>out.push({p:p[0],c:c[0],d:d[0],lng:d[1],lat:d[2],pi,ci,di}));
  }));
  _geoLeaves=out; return out;
}
/* 由 GPS 经纬度反推 省 / 市 / 区·县 */
function geoNearest(lat,lng){
  const k=Math.cos(lat*Math.PI/180);
  let best=null,bd=Infinity;
  for(const a of geoLeaves()){
    const dx=(a.lng-lng)*k, dy=a.lat-lat, d=dx*dx+dy*dy;
    if(d<bd){ bd=d; best=a; }
  }
  if(!best) return null;
  return { province:best.p, city:best.c, district:best.d,
    lat:best.lat, lng:best.lng, distanceKm:Math.round(Math.sqrt(bd)*111) };
}
/* 按名称取坐标（手动选择时用区县中心点） */
function geoLookup(province,city,district){
  const p=GEO.tree.find(x=>x[0]===province); if(!p)return null;
  const c=p[3].find(x=>x[0]===city); if(!c)return null;
  const d=(c[3]||[]).find(x=>x[0]===district);
  return d?{province,city,district,lat:d[2],lng:d[1]}:null;
}
/* 模糊搜索：省 / 市 / 区县名命中即返回完整路径 */
function geoSearch(kw,limit=8){
  kw=String(kw||'').trim().replace(/[省市县区特别行政区自治区自治州盟]/g,'');
  if(!kw) return [];
  const out=[];
  for(const a of geoLeaves()){
    const hay=(a.p+a.c+a.d).replace(/[省市县区特别行政区自治区自治州盟]/g,'');
    if(hay.includes(kw)){
      out.push({province:a.p,city:a.c,district:a.d,lat:a.lat,lng:a.lng});
      if(out.length>=limit) break;
    }
  }
  return out;
}
/* 调浏览器定位；失败返回原因，成功附区县反查结果 */
function geoLocate(){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ resolve({ok:false,reason:'unsupported'}); return; }
    let done=false;
    const finish=v=>{ if(done)return; done=true; clearTimeout(tid); resolve(v); };
    const tid=setTimeout(()=>finish({ok:false,reason:'timeout'}),9000);
    try{
      navigator.geolocation.getCurrentPosition(
        pos=>{
          const {latitude:lat,longitude:lng,accuracy}=pos.coords;
          const area=geoNearest(lat,lng);
          // 离最近区县太远（>150km，多半在境外或定位漂移）视为取不到
          if(!area||area.distanceKm>150){ finish({ok:false,reason:'outside',lat,lng,area}); return; }
          finish({ok:true,lat,lng,accuracy,area});
        },
        err=>finish({ok:false,reason:err&&err.code===1?'denied':(err&&err.code===3?'timeout':'unavailable')}),
        {enableHighAccuracy:false,timeout:8000,maximumAge:10*60*1000}
      );
    }catch(e){ finish({ok:false,reason:'unsupported'}); }
  });
}
const GEO_REASON = {
  denied:'你拒绝了定位权限', timeout:'定位超时', unavailable:'定位服务不可用',
  unsupported:'当前环境不支持定位（file:// 打开常见）', outside:'定位结果不在中国大陆范围内'
};

  </div>`;
}
function geoBindPicker(root,cur,onPick,showToast){
  const $=s=>root.querySelector(s);
  const P=$('#gpProv'), C=$('#gpCity'), D=$('#gpDist');
  const toast=showToast||function(t){ console.log(t); };
  const opts=(arr,sel)=>arr.map((x,i)=>`<option value="${i}" ${x===sel?'selected':''}>${x}</option>`).join('');
  const provNames=GEO.tree.map(p=>p[0]);

  let pi=0,ci=0,di=0;
  if(cur){
    const pIdx=provNames.indexOf(cur.province);
    if(pIdx>=0){ pi=pIdx;
      const cIdx=GEO.tree[pi][3].findIndex(c=>c[0]===cur.city);
      if(cIdx>=0){ ci=cIdx; const dIdx=(GEO.tree[pi][3][ci][3]||[]).findIndex(d=>d[0]===cur.district); if(dIdx>=0)di=dIdx; }
    }
  }
  function render(){
    P.innerHTML=opts(provNames); P.value=pi;
    const cs=GEO.tree[pi][3]; ci=Math.max(0,Math.min(ci,cs.length-1));
    C.innerHTML=opts(cs.map(c=>c[0])); C.value=ci;
    const ds=cs[ci][3]||[]; di=Math.max(0,Math.min(di,ds.length-1));
    D.innerHTML=opts(ds.map(d=>d[0])); D.value=di;
  }
  render();
  P.onchange=()=>{ pi=+P.value; ci=0; di=0; render(); };
  C.onchange=()=>{ ci=+C.value; di=0; render(); };
  D.onchange=()=>{ di=+D.value; };

  function current(){
    const p=GEO.tree[pi], c=p[3][ci], d=(c[3]||[])[di];
    return d?{province:p[0],city:c[0],district:d[0],lat:d[2],lng:d[1],source:'manual'}:null;
  }
  function setTo(loc){
    const pIdx=provNames.indexOf(loc.province); if(pIdx<0)return;
    pi=pIdx;
    const cIdx=GEO.tree[pi][3].findIndex(c=>c[0]===loc.city); ci=cIdx>=0?cIdx:0;
    const dIdx=(GEO.tree[pi][3][ci][3]||[]).findIndex(d=>d[0]===loc.district); di=dIdx>=0?dIdx:0;
    render();
    $('#gpCur').innerHTML=`📍 当前：<b>${loc.province} / ${loc.city} / ${loc.district}</b> · 已定位`;
  }
  function doSearch(){
    const kw=$('#gpKw').value.trim();
    const rs=geoSearch(kw);
    const R=$('#gpResults');
    if(!rs.length){ R.innerHTML='<div class="gp-res" style="cursor:default">没找到，试试「丰泽」「晋江」「石狮」或逐级选择</div>'; return; }
    R.innerHTML=rs.map((r,i)=>`<button type="button" class="gp-res" data-i="${i}"><b>${r.district}</b>
      <small>${r.province} / ${r.city} / ${r.district}</small></button>`).join('');
    R.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
      const loc={...rs[+b.dataset.i],source:'search'};
      setTo(loc); R.innerHTML='';
      const l=geoLookup(loc.province,loc.city,loc.district);
      onPick({...loc,...(l||{}),source:'search'});
      toast('位置已设为 '+loc.province+' / '+loc.city+' / '+loc.district);
    });
  }
  $('#gpSearchBtn').onclick=doSearch;
  $('#gpKw').addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();doSearch();} });
  $('#gpApply').onclick=()=>{
    const loc=current();
    if(!loc){ toast('请选择到区 / 县一级'); return; }
    onPick(loc); toast('位置已设为 '+loc.province+' / '+loc.city+' / '+loc.district);
  };
  $('#gpGps').onclick=async()=>{
    toast('📍 正在定位…');
    const r=await geoLocate();
    if(!r.ok){ toast('定位失败：'+(GEO_REASON[r.reason]||r.reason)+'，请手动选择'); return; }
    const loc={...r.area,lat:r.lat,lng:r.lng,source:'gps'};
    setTo(loc);
    onPick(loc); toast('定位成功：'+loc.province+' / '+loc.city+' / '+loc.district);
  };
}

/* ---------- 本机多档案（让排行榜有可排的选手） ---------- */
function ensureProfiles(){
  if(!S.profiles||!S.profiles.length){
    S.profiles=[{id:'me',name:'我',emoji:'💧',days:(S.days&&Object.keys(S.days).length?S.days:{}),submitted:{}}];
    S.activeId='me'; save();
  }
  if(!S.activeId) S.activeId=S.profiles[0].id;
}
function PROFILE(){
  ensureProfiles();
  return S.profiles.find(p=>p.id===S.activeId)||S.profiles[0];
}
function PD(){ const p=PROFILE(); return p.days||(p.days={}); }
function slotOf(ts){
  const h=new Date(ts).getHours();
  return h<9?'dawn':h<12?'morning':h<14?'noon':h<18?'afternoon':h<22?'evening':'night';
}
const SLOT_CN={dawn:'清晨',morning:'上午',noon:'午间',afternoon:'下午',evening:'傍晚',night:'深夜'};
/* 防作弊冷却独立于「提醒间隔」：默认 30 分钟，切 1 分钟演示模式也不会被绕过 */
function cooldownMin(){
  const v=Number((S.settings||{}).checkinCooldown);
  return Number.isFinite(v)&&v>=1 ? Math.min(120,v) : 30;
}

/* ---------- 防作弊：两次有效打卡必须间隔 >= 冷却 ---------- */
function lastWaterTs(){
  /* 忽略未来时间戳（导入脏数据 / 系统时间回拨），否则冷却会被算成几小时 */
  const now=Date.now();
  let t=0, days={};
  try{ days=PD(); }catch(e){ return 0; }
  for(const k in days) for(const l of (days[k].logs||[]))
    if(l.type==='water'&&l.ts<=now&&l.ts>t) t=l.ts;
  return t;
}
function checkinState(){
  const last=lastWaterTs(), cd=cooldownMin()*60000;
  const waitMs=Math.max(0,last+cd-Date.now());
  return {ok:waitMs<=0,waitMs,last,cd,nextAt:new Date(last+cd)};
}
function fmtWait(ms){
  const s=Math.ceil(ms/1000);
  return s>=60?`${Math.floor(s/60)} 分 ${String(s%60).padStart(2,'0')} 秒`:`${s} 秒`;
}
function guardCheckin(){
  const st=checkinState();
  if(st.ok) return true;
  try{ toast(`⛔ 防作弊：${cooldownMin()} 分钟内只能打卡一次，还要等 ${fmtWait(st.waitMs)}`); }catch(e){}
  return false;
}
function cooldownChip(){
  const st=checkinState();
  return st.ok ? '<span class="sc-cd ok">✓ 可打卡</span>'
    : `<span class="sc-cd">⛔ 冷却 ${fmtWait(st.waitMs)}</span>`;
}

/* ---------- 每日按时间完成加分 ---------- */
function scoreDay(day,goal){
  const logs=(day&&day.logs||[]).filter(l=>!l.ts||l.ts<=Date.now()+60000).slice().sort((a,b)=>a.ts-b.ts);
  const cd=cooldownMin()*60000;
  let running=0,valid=0,cheat=0,base=0,bonus=0,achievedAt=null,lastValid=-Infinity;
  const detail=[];
  for(const l of logs){
    if(l.type!=='water') continue;
    if(l.ts-lastValid<cd){ cheat++; continue; }
    lastValid=l.ts; valid++; running+=l.ml;
    const sl=slotOf(l.ts);
    const b=SCORE_CFG.slot[sl];
    base+=SCORE_CFG.base; bonus+=b;
    detail.push({ts:l.ts,ml:l.ml,slot:sl,base:SCORE_CFG.base,bonus:b});
    if(!achievedAt&&running>=goal) achievedAt=l.ts;
  }
  const milk=(logs.filter(l=>l.type==='milk')||[]).length;
  const achieved=running>=goal;
  let achieveBonus=0;
  if(achievedAt){
    const hh=new Date(achievedAt).getHours()+new Date(achievedAt).getMinutes()/60;
    achieveBonus=SCORE_CFG.achieveLate;
    for(const k of Object.keys(SCORE_CFG.achieveBefore).map(Number).sort((a,b)=>a-b))
      if(hh<k){ achieveBonus=SCORE_CFG.achieveBefore[k]; break; }
  }
  const goalBonus=achieved?SCORE_CFG.goalBonus:0;
  const perfect=(achieved&&milk===0)?SCORE_CFG.perfectBonus:0;
  const penalty=milk*SCORE_CFG.milkPenalty+cheat*SCORE_CFG.cheatPenalty;
  const total=Math.max(0,base+bonus+achieveBonus+goalBonus+perfect-penalty);
  return {total,base,bonus,achieveBonus,goalBonus,perfect,penalty,valid,cheat,milk,
    achieved,achievedAt,ml:running,goal,detail};
}
function todayScore(){
  const day=today();
  return scoreDay(day,day.goalSnapshot||goalOf());
}
/* 结算提交：同日只保留更高分，避免反复结算刷分 */
function submitDay(dateKey,quote,mood){
  const p=PROFILE(), day=PD()[dateKey];
  if(!day||!(day.logs||[]).length) return null;
  const sc=scoreDay(day,day.goalSnapshot||goalOf());
  p.submitted=p.submitted||{};
  const rec={date:dateKey,score:sc.total,ml:sc.ml,goal:sc.goal,valid:sc.valid,cheat:sc.cheat,
    milk:sc.milk,achieved:sc.achieved,achievedAt:sc.achievedAt,quote:quote||'',
    mood:mood||day.mood||S.settings.mood,at:Date.now(),code:checkCode(p.id+dateKey+sc.total+sc.valid)};
  if(!p.submitted[dateKey]||sc.total>=p.submitted[dateKey].score) p.submitted[dateKey]=rec;
  save();
  return rec;   // 始终返回当次成绩，分享卡校验码与卡面一致
}
function profileTotal(p){
  return Object.values(p.submitted||{}).reduce((s,r)=>s+(r.score||0),0);
}
function boardRows(){
  ensureProfiles();
  const dk=dkey();
  const todayRows=S.profiles.map(p=>{
    const day=(p.days||{})[dk], sc=scoreDay(day,day?.goalSnapshot||goalOf());
    return {id:p.id,name:p.name,emoji:p.emoji,me:p.id===S.activeId,score:sc.total,
      sub:`${sc.ml}/${sc.goal}ml · 有效 ${sc.valid} 次${sc.achieved?' · 已达标':''}`,data:sc};
  }).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));
  const allRows=S.profiles.map(p=>({
    id:p.id,name:p.name,emoji:p.emoji,me:p.id===S.activeId,score:profileTotal(p),
    sub:`${Object.keys(p.submitted||{}).length} 天成绩 · 最佳 ${Math.max(0,...Object.values(p.submitted||{}).map(r=>r.score||0))} 分`
  })).sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name));
  return {todayRows,allRows,dk};
}
function checkCode(str){
  let h=2166136261;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  return 'DW-'+h.toString(36).toUpperCase().slice(0,6).padEnd(6,'0');
}

let boardTab='today';
function leaderboardHTML(){

function renderBoard(root){
  const {todayRows,allRows}=boardRows();
  const rows=boardTab==='today'?todayRows:allRows;
  const rk=n=>n===1?'🥇':n===2?'🥈':n===3?'🥉':String(n);
  root.querySelector('#scList').innerHTML=rows.map((r,i)=>`
    <div class="sc-row ${r.me?'me':''}">
      <div class="sc-rk ${i===0?'g1':i===1?'g2':i===2?'g3':''}">${rk(i+1)}</div>
      <div class="sc-nm">${esc(r.emoji||'💧')} ${esc(r.name)}${r.me?' <small>当前档案</small>':''}
        <small>${esc(r.sub)}</small></div>
      <div class="sc-pt">${r.score}</div>
      <button class="btn ghost" data-sw="${r.id}" style="padding:4px 8px;font-size:10px" ${r.me?'disabled':''}>切换</button>
      ${S.profiles.length>1&&!r.me?`<button class="btn ghost" data-rm="${r.id}" style="padding:4px 8px;font-size:10px;color:#b8615a">×</button>`:''}
    </div>`).join('');
  root.querySelector('#scRule').innerHTML=boardTab==='today'
    ? `<b>今日按时间完成加分</b>：每次合规打卡 +${SCORE_CFG.base}，清晨 +${SCORE_CFG.slot.dawn} / 上午 +${SCORE_CFG.slot.morning} / 午间 +${SCORE_CFG.slot.noon} / 下午 +${SCORE_CFG.slot.afternoon} / 傍晚 +${SCORE_CFG.slot.evening} / 深夜 +${SCORE_CFG.slot.night}；越早达标奖励越高（12点前 +${SCORE_CFG.achieveBefore[12]} → 22点后 +${SCORE_CFG.achieveLate}）；达标 +${SCORE_CFG.goalBonus}、零奶茶 +${SCORE_CFG.perfectBonus}；连打 -${SCORE_CFG.cheatPenalty}/次、奶茶 -${SCORE_CFG.milkPenalty}/杯。`
    : `<b>历史总榜</b>：累计每日结算成绩（同一天反复结算只取更高分，不刷分）。当前档案 <b>${esc(PROFILE().name)}</b>，共 ${Object.keys(PROFILE().submitted||{}).length} 天成绩。`;
  root.querySelector('#scTip').textContent=`当前档案：${PROFILE().name} · 切换档案会连同饮水记录一起切换（数据都在本机）`;
  root.querySelectorAll('[data-bt]').forEach(b=>b.classList.toggle('on',b.dataset.bt===boardTab));
}
function bindBoard(root){
  function refresh(){ renderBoard(root); }
  refresh();   // 打开时先渲染一次
  // 事件委托：列表重绘后按钮依然有效
  root.onclick=e=>{
    const bt=e.target.closest('[data-bt]');
    if(bt){ boardTab=bt.dataset.bt; refresh(); return; }
    const sw=e.target.closest('[data-sw]');
    if(sw&&!sw.disabled){
      S.activeId=sw.dataset.sw; save(); refresh();
      try{ if(typeof renderAll==='function')renderAll(); }catch(_){}
      try{ if(typeof renderHUD==='function')renderHUD(); }catch(_){}
      toast('已切换到 '+PROFILE().name); return;
    }
    const rm=e.target.closest('[data-rm]');
    if(rm){
      const p=S.profiles.find(x=>x.id===rm.dataset.rm); if(!p)return;
      if(!confirm(`删除档案「${p.name}」及其全部饮水记录？不可撤销。`))return;
      S.profiles=S.profiles.filter(x=>x.id!==rm.dataset.rm);
      if(S.activeId===rm.dataset.rm) S.activeId=S.profiles[0].id;
      save(); refresh(); try{ if(typeof renderAll==='function')renderAll(); }catch(_){}
      return;
    }
    if(e.target.closest('#scAdd')){
      const inp=root.querySelector('#scName'), name=inp.value.trim();
      if(!name){ toast('先给选手起个名'); return; }
      if(S.profiles.length>=8){ toast('本机最多 8 个档案'); return; }
      const emo=['🐱','🐶','🐻','🦊','🐼','🐸','🐧','🦉'][S.profiles.length%8];
      S.profiles.push({id:'p'+Date.now().toString(36),name:name.slice(0,12),emoji:emo,days:{},submitted:{}});
      save(); inp.value=''; refresh(); toast('已添加选手 '+name); return;
    }
    if(e.target.closest('#scShare')){ try{closeModal();}catch(_){ } openShareCard({mode:'board'}); return; }
    if(e.target.closest('#scClose')){ try{closeModal();}catch(_){ } return; }
  };
}
function openBoard(){ openModal(leaderboardHTML()); bindBoard($('#modalBox')); }

function buildShareText(o){
  const s=o.sc, p=PROFILE();
  return `【大水计算器 · ${o.mode==='settle'?'今日心情结算':'今日打卡'}】\n`+
    `${o.date} ${o.time} · ${locLabel()}\n`+
    `💧 白水 ${s.ml}/${s.goal}ml（${Math.round(s.ml/s.goal*100)}%）${s.achieved?' ✓ 已达标':''}\n`+
    `🏆 今日 ${s.total} 分 · 有效打卡 ${s.valid} 次${s.cheat?` · 拦截连打 ${s.cheat} 次`:''}\n`+
    `💭 心情：${o.mood}${o.quote?'\n✦ '+o.quote:''}\n`+
    `校验码 ${o.code}（本机防作弊，数据不上传）\n`+
    `弱者喝饮料，强者喝大水。`;
}
function drawShareCard(o){
  const W=640,H=960,c=document.createElement('canvas'); c.width=W;c.height=H;
  const g=c.getContext('2d');
  if(!g.roundRect) g.roundRect=function(x,y,w,h,r){ this.rect(x,y,w,h); return this; };
  const grd=g.createLinearGradient(0,0,W,H);
  grd.addColorStop(0,'#eaf3f6'); grd.addColorStop(.55,'#f7f3ea'); grd.addColorStop(1,'#e8eee6');
  g.fillStyle=grd; g.fillRect(0,0,W,H);
  // 装饰圆
  g.globalAlpha=.10; g.fillStyle='#5b8fa8';
  [[70,120,130],[580,860,170],[540,60,70]].forEach(([x,y,r])=>{g.beginPath();g.arc(x,y,r,0,7);g.fill();});
  g.globalAlpha=1;
  // 卡片
  g.fillStyle='rgba(255,255,255,.92)';
  g.beginPath(); g.roundRect(28,28,W-56,H-56,26); g.fill();
  g.strokeStyle='rgba(91,143,168,.25)'; g.lineWidth=2; g.stroke();
  const F='"PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif';
  g.textAlign='left'; g.fillStyle='#3d6d87'; g.font=`800 22px ${F}`;
  g.fillText('💧 大水计算器',60,86);
  g.fillStyle='#8b8276'; g.font=`600 12px ${F}`;
  g.fillText(o.mode==='settle'?'今日心情结算 · 打卡分享':'每日打卡 · 成绩分享',60,110);
  g.textAlign='right'; g.fillStyle='#a09788'; g.font=`600 12px ${F}`;
  g.fillText(o.date+' '+o.time,W-60,110);
  g.textAlign='left';
  // 大分数
  g.fillStyle='#3d6d87'; g.font=`800 76px ${F}`;
  g.fillText(String(o.sc.total),60,206);
  g.fillStyle='#6b6255'; g.font=`700 16px ${F}`; g.fillText('今日积分',60,232);
  g.textAlign='right'; g.fillStyle='#6c9a76'; g.font=`800 20px ${F}`;
  g.fillText(o.sc.achieved?'✓ 已达标':`${Math.round(o.sc.ml/o.sc.goal*100)}%`,W-60,196);
  g.fillStyle='#8b8276'; g.font=`600 12px ${F}`; g.fillText(`白水 ${o.sc.ml} / ${o.sc.goal} ml`,W-60,220);
  g.textAlign='left';
  // 分隔
  g.strokeStyle='rgba(90,78,62,.14)'; g.beginPath(); g.moveTo(60,250); g.lineTo(W-60,250); g.stroke();
  // 明细
  const items=[
    ['🕒 达标时刻',o.sc.achievedAt?fmtTime(o.sc.achievedAt):'尚未达标'],
    ['✅ 有效打卡',o.sc.valid+' 次'],
    ['⛔ 拦截连打',o.sc.cheat+' 次'],
    ['🥤 小甜水',o.sc.milk+' 杯'],
    ['💭 今日心情',o.mood],
    ['📍 所在位置',locLabel()]
  ];
  g.font=`600 14px ${F}`;
  items.forEach((it,i)=>{
    const x=60+(i%2)*270, y=288+Math.floor(i/2)*40;
    g.fillStyle='#8b8276'; g.fillText(it[0],x,y);
    g.fillStyle='#3a3630'; g.font=`700 14px ${F}`; g.fillText(String(it[1]).slice(0,14),x+112,y);
    g.font=`600 14px ${F}`;
  });
  // 语录
  if(o.quote){
    g.fillStyle='#f2f7fa'; g.beginPath(); g.roundRect(60,418,W-120,104,14); g.fill();
    g.fillStyle='#3d6d87'; g.font=`700 13px ${F}`; g.fillText('✦ 今日大水语录',78,444);
    g.fillStyle='#4a5a63'; g.font=`600 13px ${F}`;
    const q=o.quote.replace(/\s+/g,' ');
    let line='',y=468;
    for(const ch of q){
      if(g.measureText(line+ch).width>W-160){ g.fillText(line,78,y); line=ch; y+=20; if(y>510)break; }
      else line+=ch;
    }
    if(line&&y<=510) g.fillText(line,78,y);
  }
  // 得分构成
  const bd=[`打卡 +${o.sc.base}`,`时段 +${o.sc.bonus}`,`早达标 +${o.sc.achieveBonus}`,
    `达标 +${o.sc.goalBonus}`,`零奶茶 +${o.sc.perfect}`,`扣分 -${o.sc.penalty}`];
  g.font=`600 11px ${F}`;
  bd.forEach((t,i)=>{
    const x=60+(i%3)*174, y=556+Math.floor(i/3)*30;
    g.fillStyle=o.sc.penalty&&i===5?'#f6e9e5':'#eef4f7';
    g.beginPath(); g.roundRect(x,y-15,160,24,12); g.fill();
    g.fillStyle=o.sc.penalty&&i===5?'#a2564e':'#4d7a91'; g.fillText(t,x+9,y+1);
  });
  // 榜单
  if(o.boardLine){
    g.fillStyle='#f7f3ea'; g.beginPath(); g.roundRect(60,632,W-120,54,12); g.fill();
    g.fillStyle='#7a5a2c'; g.font=`700 13px ${F}`; g.fillText('🏆 '+o.boardLine,78,664);
  }
  // 校验码
  g.fillStyle='#3d6d87'; g.font=`800 15px ui-monospace,Menlo,Consolas,monospace`;
  g.fillText(o.code,60,740);
  g.fillStyle='#8b8276'; g.font=`600 11px ${F}`;
  g.fillText('本机防作弊校验码 · 打卡冷却 '+cooldownMin()+' 分钟（独立于提醒间隔）',60,762);
  // 落款
  g.strokeStyle='rgba(90,78,62,.14)'; g.beginPath(); g.moveTo(60,800); g.lineTo(W-60,800); g.stroke();
  g.fillStyle='#3a3630'; g.font=`800 18px ${F}`; g.fillText('弱者喝饮料，强者喝大水。',60,838);
  g.fillStyle='#a09788'; g.font=`600 11px ${F}`;
  g.fillText('数据仅存本机 · 不联网 · 不上传 · 大水理论是网络梗，不是医学结论',60,868);
  g.textAlign='right'; g.fillStyle='#8b8276'; g.font=`600 11px ${F}`;
  g.fillText(`档案：${PROFILE().name}`,W-60,890);
  return c.toDataURL('image/png');
}
function openShareCard(opts){

    try{
      const blob=await (await fetch(png)).blob();

/* ---------------- 天气 ---------------- */
function wmoKind(code,t){
  if(t!==null&&t>=30)return'热';
  if(code===0)return'晴';
  if([1,2,3].includes(code))return t!==null&&t<=8?'冷':'阴';
  if([45,48].includes(code))return'阴';
  if((code>=51&&code<=67)||(code>=80&&code<=82)||(code>=95))return'雨';
  if(code>=71&&code<=77)return'冷';
  if(t!==null&&t<=9)return'冷';
  return'阴';
}
async function fetchWeather(force){
  if(!force && weather.live && Date.now()-weather.at<30*60*1000) return;
  const loc=S.location||FALLBACK_LOC;
  const label=locLabel();
  try{
    const u=new URL('https://api.open-meteo.com/v1/forecast');
    u.search=new URLSearchParams({latitude:loc.lat,longitude:loc.lng,
      current:'temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m',
      timezone:(Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Shanghai')});
    const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),7000);
    const r=await fetch(u,{signal:ctl.signal}); clearTimeout(t);
    if(!r.ok) throw 0;
    const j=await r.json(), c=j.current||{};
    const temp=typeof c.temperature_2m==='number'?Math.round(c.temperature_2m):null;
    const code=c.weather_code??0;
    weather={kind:wmoKind(code,temp),temp,code,desc:WMO[code]||'多云',humidity:c.relative_humidity_2m,
      wind:c.wind_speed_10m,feel:c.apparent_temperature,live:true,at:Date.now(),city:label};
  }catch(e){
    weather={kind:S.manualWeather||'晴',temp:null,desc:'（离线，手动设定）',live:false,at:Date.now(),city:label};
  }
  renderHUD();
}
/* 位置应用：保存 → 重新取天气 → 刷新 HUD */
function applyLocation(loc,quiet){
  S.location={...loc}; S.locatedOnce=true; save();
  fetchWeather(true);
  renderHUD();
  if(!quiet) toast('📍 位置已更新：'+locLabel());
}
/* 首次定位：取不到就打开省/市/区县三级选择器 */
async function initLocation(){
  if(S.locatedOnce && S.location){ renderHUD(); return; }
  S.locatedOnce=true; save();
  const r=await geoLocate();
  if(r.ok){
    applyLocation({...r.area,lat:r.lat,lng:r.lng,source:'gps'},true);
    toast('📍 已定位到 '+r.area.province+' / '+r.area.city+' / '+r.area.district,3200);
  }else{
    S.location={...FALLBACK_LOC}; save(); renderHUD();
    toast('定位取不到：'+(GEO_REASON[r.reason]||r.reason)+'，请自己选一下',3800);
    openLocationPicker();
  }
}
function openLocationPicker(){
  const cur=S.location||FALLBACK_LOC;

    <div class="msub">定位没成功，选到「省 / 市 / 区·县·县级市」这一级就行</div>

}

const CAT_TAIL = ['——本子记下了，喵。','（推了推眼镜）','（尾巴晃了一下）','（在监察本上画了个勾）'];

function progressWord(p){ for(const [lim,arr] of PROGRESS_WORD) if(p<lim) return rnd(arr); return rnd(PROGRESS_WORD.at(-1)[1]); }
function buildCtx(){
  const day=today();
  return { slot:timeSlot(), kind:weather.live?weather.kind:(S.manualWeather||weather.kind),
    mood:V?V.mood:S.settings.mood, pct:pctOf(), milkToday:sinsOf(day), city:locLabel(),
    temp:weather.temp, desc:weather.desc, ml:waterOf(day), goal:goalOf(),
    clock:nowMin(), time:clockStr(), date:clockDate() };
}
function localQuote(ctx){
  const night=ctx.slot==='night', sin=ctx.milkToday>0;
  let s;
  if(sin&&Math.random()<.55){
    s=`档案里还留着你今天 ${ctx.milkToday} 杯小甜水，喵。${rnd(['自首不丢人，继续灌大水才体面。','奶茶不解人生，大水才解。','用小甜水对抗内耗，方向反了。'])}`;
  }else{
    s=[`${rnd(TIME_WORD[ctx.slot])}，${weatherWord(ctx.kind,ctx.slot)}，${rnd(MOOD_WORD[ctx.mood])}——`,
       `${progressWord(ctx.pct)}。`,
       night?rnd(NIGHT_ACTION):(ctx.pct>=1?rnd(CELEBRATE):rnd(ACTION))].join('');
    if(Math.random()<.5) s+=' '+rnd(GOLDEN);
  }
  return { text:s, tags:[ '🕒 '+ctx.date+' '+ctx.time,
    `📍 ${ctx.city}`, `🌤 ${ctx.temp!==null?ctx.temp+'℃ ':''}${ctx.kind}`, '💭 '+ctx.mood,
    '📊 '+Math.round(ctx.pct*100)+'%' ] };
}
async function makeQuote(){
  const ctx=buildCtx(), q=localQuote(ctx), cfg=S.settings.llm;
  let result=q, engine='本地语录引擎';
  if(cfg.endpoint&&cfg.key){
    try{
      const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),9000);
      const r=await fetch(cfg.endpoint.replace(/\/+$/,'')+'/chat/completions',{
        method:'POST',signal:ctl.signal,
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
        body:JSON.stringify({model:cfg.model,temperature:1.05,max_tokens:120,messages:[
          {role:'system',content:'你是「哈士喵」，一只戴圆框眼镜的灰白猫，担任大水监察司首席监察喵。只输出一句 25~55 字的中文大水语录，可带一点「喵」和推眼镜的动作感。背景：2026年网络梗「大水理论」，口号「弱者喝饮料，强者喝大水」「小水解渴，大水解人生」，主张用1.5L以上白水替代奶茶咖啡，认为精神内耗是水喝少了。语气魔性、笃定、带点抽象幽默，不要说教、不要医学建议、不要加引号、不要解释、不要分点。'},
          {role:'user',content:`当前：${ctx.date} ${ctx.time}（${ctx.slot}）、${ctx.city}${ctx.temp!==null?ctx.temp+'℃':''}${ctx.kind}、用户心情${ctx.mood}、今日饮水${ctx.ml}/${ctx.goal}ml（${Math.round(ctx.pct*100)}%）、今日偷喝奶茶${ctx.milkToday}杯。生成一句贴合条件的大水语录。`}
        ]})
      });
      clearTimeout(t);
      if(r.ok){
        const j=await r.json(); const t2=(j.choices?.[0]?.message?.content||'').trim().replace(/^["“]|["”]$/g,'');
        if(t2){ result={text:t2,tags:q.tags}; engine='在线模型 · '+cfg.model; }
      }
    }catch(e){}
  }
  S.quoteBook.unshift({text:result.text,tags:result.tags,ts:Date.now(),engine});
  S.quoteBook=S.quoteBook.slice(0,120); save();
  return result;
}

/* ---------------- 演出工具 ---------------- */
function toast(t,ms=2600){
  const el=$('#toast'); el.textContent=t; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),ms);
}
function sfx(k='tick'){
  if(!S.settings.sound)return;
  try{ const a=new Audio(A.audio[k]); a.volume=.35; a.play().catch(()=>{}); }catch(e){}
}
function bgm(name){
  if(!S.settings.bgm) { if(audioEl){audioEl.pause();audioEl=null;} return; }
  if(curBgm===name && audioEl) return;
  curBgm=name;
  try{
    if(audioEl){audioEl.pause();}
    audioEl=new Audio(A.audio[name]); audioEl.loop=true; audioEl.volume=.22;
    audioEl.play().catch(()=>{});
  }catch(e){}
}
function setBG(key,instant){
  const el=$('#bgLayer'), src=A.bg[key]||A.bg[BG.home];
  if(el.dataset.key===key) return;
  el.dataset.key=key;
  if(instant){ el.src=src; return; }
  el.style.opacity='0';
  setTimeout(()=>{ el.src=src; el.style.opacity='1'; },240);
}
function setFace(key){
  const el=$('#petImg'), src=A.face[key]||A.face['平静'];
  if(el.dataset.key===key) return;
  el.dataset.key=key; el.style.opacity='0';
  setTimeout(()=>{ el.src=src; el.style.opacity='1'; },140);
  $('#pet').classList.add('speaking');
  clearTimeout(setFace._t); setFace._t=setTimeout(()=>$('#pet').classList.remove('speaking'),900);
}
function showCG(key,ms=2600){
  const el=$('#cgLayer'); el.src=A.cg[key]; el.classList.add('show');
  if(!S.unlockedCG.includes(key)){ S.unlockedCG.push(key); save(); toast('📖 新 CG 解锁：'+key.split('_').slice(1).join('_')); }
  clearTimeout(cgTimer);
  if(ms>0) cgTimer=setTimeout(()=>el.classList.remove('show'),ms);
}
function hideCG(){ $('#cgLayer').classList.remove('show'); clearTimeout(cgTimer); }
function fadeSwap(fn){
  const f=$('#fade'); f.classList.add('show');
  setTimeout(()=>{ fn(); setTimeout(()=>f.classList.remove('show'),90); },430);
}
function highlight(t){
  return esc(t)
    .replace(/大水/g,'<span class="em">大水</span>')
    .replace(/奶茶|小甜水/g,'<span class="gold">$&</span>')
    .replace(/1\.5L|1700ml|1500ml/g,'<span class="em">$&</span>');
}
function typeText(raw,done){
  clearInterval(typing);
  const el=$('#text'), plain=raw.replace(/\n/g,' '), html=highlight(raw);
  el.innerHTML=''; $('#choices').innerHTML='';
  $('#hint').textContent=''; $('#hint').classList.remove('blink');
  if(skipOn){ el.innerHTML=html; finish(); return; }
  let i=0; const box=document.createElement('span');
  el.appendChild(box);
  // 用纯文本逐字，完成后替换为高亮 HTML
  typing=setInterval(()=>{
    i++; box.textContent=plain.slice(0,i);
    if(i>=plain.length){ clearInterval(typing); el.innerHTML=html; finish(); }
  },26);
  function finish(){
    $('#hint').textContent='▼'; $('#hint').classList.add('blink');
    if(done) done();
    requestAnimationFrame(placePet);
    if(autoOn && $('#choices .choice')) setTimeout(()=>{
      const c=$('#choices .choice'); if(c && !c.dataset.manual) c.click();
    },1500);
  }
}
function skipTyping(){
  if(!typing) return;
  clearInterval(typing); typing=null;
  // 重新渲染当前节点文本
  if(V && V._curRaw!==undefined){ $('#text').innerHTML=highlight(V._curRaw); $('#hint').textContent='▼'; $('#hint').classList.add('blink'); if(V._curDone) V._curDone(); }
}
function say(speaker,text,face,done,small){
  $('#speaker').innerHTML=esc(speaker)+(small?` <small>${esc(small)}</small>`:'');
  if(face) setFace(face);
  history.push({speaker,text,ts:Date.now()}); if(history.length>60)history.shift();
  V._curRaw=text; V._curDone=done;
  typeText(text,done);
}
function choices(list){
  const box=$('#choices'); box.innerHTML='';
  pendingChoices=list;
  list.forEach(c=>{
    const b=document.createElement('button');
    b.className='choice '+(c.cls||'');
    b.innerHTML=`<span class="ic">${c.ic||'▸'}</span><span>${esc(c.label)}</span>`+(c.tail?`<span class="tail">${esc(c.tail)}</span>`:'');
    b.onclick=()=>{ sfx('tick'); hideCG(); clearInterval(typing); c.act(); };
    box.appendChild(b);
  });
  requestAnimationFrame(placePet);
}
let petDragged=false;
function placePet(){
  if(petDragged) return;
  const f=$('#frame'), h=$('#dialogue').offsetHeight, H=f.clientHeight;
  const bottom=clamp(h+14,160,Math.round(H*.50));
  $('#pet').style.bottom=bottom+'px';
  $('#petTag').style.bottom=Math.max(8,bottom-4)+'px';
}
function renderHUD(){
  if(!V)return;
  $('#hClock').textContent=clockStr();
  $('#hDate').textContent=clockDate();
  const w=weather.live?`${weather.desc}${weather.temp!==null?' '+weather.temp+'℃':''}`:(S.manualWeather||'晴');
  $('#hWeather').textContent='🌤 '+w;
  const l=S.location||FALLBACK_LOC;
  $('#hLoc').textContent='📍 '+l.city.replace(/市$|地区$|自治州$|盟$/, '')+'·'+l.district+
    (l.source==='gps'?' ⌖':'');
  $('#hLoc').onclick=openLocationPicker;
  $('#hMood').textContent='💭 '+V.mood;
  const day=today(), ml=waterOf(day), g=goalOf(), p=clamp(ml/g,0,1);
  day.goalSnapshot=g; save();
  $('#hMl').textContent=ml; $('#hGoal').textContent=g;
  try{
    const _sc=todayScore(), _st=checkinState();
    $('#hScore').textContent=_sc.total;
    $('#hCd').textContent=_st.ok?'✓ 可打卡':'⛔ '+fmtWait(_st.waitMs);
    $('#hScoreChip').title=`今日 ${_sc.total} 分 · 有效打卡 ${_sc.valid} 次 · 防作弊冷却 ${cooldownMin()} 分钟`;
  }catch(e){}
  $('#kpiFill').style.width=(p*100)+'%';
  $('#petTag').textContent=`今日 ${Math.round(p*100)}%`+(sinsOf(day)?` · 🥤${sinsOf(day)}`:'');
}

async function capturePhoto(){
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw 0;
    const st=await navigator.mediaDevices.getUserMedia({video:{width:320,height:240,facingMode:'user'},audio:false});
    const v=document.createElement('video'); v.srcObject=st; v.playsInline=true; v.muted=true; await v.play();
    await new Promise(r=>setTimeout(r,420));
    const c=document.createElement('canvas'); c.width=320; c.height=240;
    c.getContext('2d').drawImage(v,0,0,320,240);
    const url=c.toDataURL('image/jpeg',.72); st.getTracks().forEach(t=>t.stop());
    return {url,source:'camera'};
  }catch(e){ return {url:null,source:'denied'}; }
}
function placeholderPhoto(){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="320" height="240"><rect width="320" height="240" fill="#eee7db"/>
  <circle cx="160" cy="88" r="44" fill="#ddd2c0"/><rect x="126" y="138" width="68" height="74" rx="8" fill="#f6ecdc" stroke="#d9c3a2" stroke-width="3"/>
  <text x="160" y="182" font-size="15" font-weight="bold" fill="#a67c4c" text-anchor="middle" font-family="sans-serif">奶茶</text>
  <text x="160" y="228" font-size="11" fill="#8b8276" text-anchor="middle" font-family="sans-serif">摄像头未授权 · 供词立案速写</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

function streak(){
  let n=0; const d=new Date();
  for(let i=0;i<400;i++){
    const day=PD()[dkey(d)], w=day?waterOf(day):0, g=day?.goalSnapshot||Number(S.settings.goal)||1700;
    if(w>=g)n++; else if(i===0){ d.setDate(d.getDate()-1); continue; } else break;
    d.setDate(d.getDate()-1);
  }
  return n;
}

function remind(){
  S.lastRemindAt=Date.now(); today().reminds.push(Date.now()); save();
  sfx('tick');
  if(S.settings.notify&&'Notification'in window&&Notification.permission==='granted'){
    try{ new Notification('大水监察司 · 该喝大水了',{body:'半小时到，喵。起来吨一口。',tag:'dashui-avg'}); }catch(e){}
  }
  if($('#mask').classList.contains('show')) { toast('⏰ 半小时到，起来喝大水，喵'); return; }
  const saved={scene:V.scene};
  setFace('揭晓');
  makeQuote().then(q=>{
    say('哈士喵',`「⏰ 半小时到了，喵。」\n${q.text}\n${rnd(CAT_TAIL)}`,'揭晓',()=>{
      choices([
        {label:'吨一口（+250ml）',ic:'💧',act:()=>addWater(250,'drink')},
        {label:'记一句就好，继续',ic:'↩',act:()=>goto(saved.scene)}
      ]);
    },'半小时提醒');
  });
  toast('⏰ '+clockStr()+' 到点，起来喝大水，喵');
  maybePatrol();
}
function maybePatrol(){
  if(!S.settings.patrol)return;
  if($('#mask').classList.contains('show'))return;
  if(Date.now()-(S.lastPatrolAt||0)<20*60*1000)return;
  S.lastPatrolAt=Date.now(); save();
  if(Math.random()>0.18)return;
  setFace('抱本子');
  say('哈士喵','「……例行巡检，喵。」\n它突然从本子后面抬起头，圆框眼镜反了一下光。\n「手边那杯，是白水吗？」','抱本子',()=>{
    choices([
      {label:'是白水，接受检查',ic:'💧',act:()=>{ say('哈士喵','「嗯，通过。」它在监察本上画了个勾，喵。',null,()=>{ choices([{label:'回工位',ic:'↩',act:backToHub}]); }); }},
      {label:'……是奶茶，我自首',ic:'🥤',cls:'warn',act:()=>goto('sinScene')}
    ]);
  });
}
function nextRemindTime(){
  const mins=Number(S.settings.interval)||30;
  const t=new Date((S.lastRemindAt||Date.now())+mins*60000);
  return String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
}
function tick(){
  const mins=Number(S.settings.interval)||30;
  if(!S.lastRemindAt) S.lastRemindAt=Date.now(), save();
  else if(Date.now()-S.lastRemindAt>=mins*60*1000) remind();
  const el=$('#hClock'); if(el) el.title='当前 '+clockDate()+' '+clockStr()+' · 下次提醒约 '+nextRemindTime();
}

        <div class="meta"><b>${esc(l.note)}${l.photo?' 📷':''}</b><span>${fmtTime(l.ts)}</span></div>
        <div style="font-weight:800;color:${l.type==='milk'?'#b8615a':'#3d6d87'}">${l.type==='milk'?'留档':'+'+l.ml+'ml'}</div>
        <button class="btn ghost" data-del="${l.id}" style="padding:5px 9px">删</button></div>`).join(''):'<div class="empty">今天还没有记录，喵</div>');
    $$('#dBody [data-del]').forEach(x=>x.onclick=()=>{
      today().logs=today().logs.filter(l=>l.id!==x.dataset.del); save(); renderHUD(); renderDrawer(); toast('已删除');
    });
  }else if(drawerTab==='存档'){
    b.innerHTML=`<div class="card"><h4>存档</h4><p>3 个槽位，存本机。饮水记录按日期独立保存，读档不会丢。</p></div>`+
      S.saves.map((s,i)=>`<div class="slot"><div class="meta"><b>槽位 ${i+1}</b><span>${s?`${s.date} · ${s.time||fmtTime(s.ts)} · 白水 ${s.ml}ml · ${SCENES[s.scene]?'剧情中':'—'}`:'空'}</span></div>
        <button class="btn" data-save="${i}" style="padding:6px 11px">存</button>
        <button class="btn ghost" data-load="${i}" style="padding:6px 11px" ${s?'':'disabled'}>读</button></div>`).join('')+
      `<div class="btnrow"><button class="btn warn" id="wClear">清空全部数据</button></div>`;
    $$('#dBody [data-save]').forEach(x=>x.onclick=()=>{
      const i=+x.dataset.save;
      S.saves[i]={date:dkey(),time:clockStr(),ts:Date.now(),mood:V.mood,trust:V.trust,flags:V.flags,scene:V.scene,ml:waterOf(today())};
      save(); renderDrawer(); toast('已存入槽位 '+(i+1));
    });
    $$('#dBody [data-load]').forEach(x=>x.onclick=()=>{
      const i=+x.dataset.load,s=S.saves[i]; if(!s)return;
      V.mood=s.mood; V.trust=s.trust; V.flags=s.flags||{};
      S.settings.mood=s.mood; save(); closeDrawer(); hideCG(); goto(s.scene||'hub'); toast('读档完成，喵');
    });
    $('#wClear').onclick=()=>{
      if(!confirm('清空所有饮水记录、照片、语录与存档？不可撤销。'))return;
      localStorage.removeItem(KEY); S=structuredClone(DEFAULT); save(); closeDrawer(); newDay(); toast('已清空，重新开始大水时代');
    };
  }else if(drawerTab==='设置'){
    const s=S.settings;
    b.innerHTML=`<div class="field"><label>每日目标 ml</label><input id="sGoal" type="number" min="500" max="4000" value="${s.goal}">
      <div class="hint">《中国居民膳食指南(2022)》：温和气候低活动量成人男 1700ml / 女 1500ml。</div></div>
      <div class="field"><label>提醒间隔</label><select id="sInterval">
        <option value="1" ${s.interval==1?'selected':''}>1 分钟（演示模式）</option>
        <option value="15" ${s.interval==15?'selected':''}>15 分钟</option>
        <option value="30" ${s.interval==30?'selected':''}>30 分钟（默认）</option>
        <option value="60" ${s.interval==60?'selected':''}>60 分钟</option></select></div>
      <div class="field"><label>⛔ 打卡冷却（防作弊，分钟）</label>
        <input id="sCooldown" type="number" min="1" max="120" value="${clamp(Number(s.checkinCooldown)||30,1,120)}">
        <div class="hint">两次喝水打卡至少间隔这么久，冷却期内再点会被拦下。独立于提醒间隔，切「1 分钟演示模式」也不会放宽。改小后历史连打判定会同步变化。</div></div>
      <div class="field"><label>📍 位置（省 / 市 / 区·县·县级市）</label>
        <div class="gp-cur" style="margin-bottom:8px">当前：<b>${esc(locLabel())}</b> · ${(S.location||FALLBACK_LOC).source==='gps'?'GPS 定位':'手动 / 默认'}<br>
          <span style="font-size:10px;opacity:.7">坐标 ${(S.location||FALLBACK_LOC).lat.toFixed(3)}, ${(S.location||FALLBACK_LOC).lng.toFixed(3)}（WGS-84）</span></div>
        <button class="btn primary" id="sLoc" style="width:100%">📍 重新定位 / 手动选择省市区</button>
        <div class="hint">定位取不到（拒绝权限、file:// 打开、超时）时会展开三级选择器，也可直接搜「丰泽」「晋江」「石狮」。</div></div>
      <div class="field"><label>手动天气（天气接口取不到时用）</label>
        <div class="chips">${WEATHER_KINDS.map(k=>`<button class="chip ${S.manualWeather===k?'on':''}" data-w="${k}">${k}</button>`).join('')}</div></div>
      <div class="field"><label>开关</label><div class="chips">
        <button class="chip ${s.sound?'on':''}" data-tog="sound">🔊 音效</button>
        <button class="chip ${s.bgm?'on':''}" data-tog="bgm">🎵 BGM</button>
        <button class="chip ${s.notify?'on':''}" data-tog="notify">🔔 系统通知</button>
        <button class="chip ${s.patrol?'on':''}" data-tog="patrol">🔍 随机巡检</button>
        <button class="chip ${s.autoGoalByWeather?'on':''}" data-tog="autoGoalByWeather">🌡 热天 +300ml</button></div></div>
      <div class="field"><label>在线大模型语录（可选）</label>
        <input id="sEndpoint" placeholder="https://api.xxx.com/v1" value="${esc(s.llm.endpoint)}">
        <input id="sKey" type="password" placeholder="API Key（仅存本机）" value="${esc(s.llm.key)}" style="margin-top:7px">
        <input id="sModel" placeholder="模型名" value="${esc(s.llm.model)}" style="margin-top:7px">
        <div class="hint">兼容 OpenAI Chat Completions；不填则用内置语录引擎，超时自动回退。</div></div>
      <div class="card" style="margin-top:12px"><h4>⛔ 防作弊与积分</h4><p>两次喝水打卡至少间隔上方「打卡冷却」（默认 30 分钟，独立于提醒间隔），冷却期内再点会被拦下；连打记录不计分且扣分。今日榜按打卡时段与达标时刻加分，历史总榜累计每日结算成绩，同一天只取更高分。可在 🏆 排行榜里增删本机档案。</p></div>
      <div class="btnrow"><button class="btn ghost" id="sCancel">取消</button><button class="btn primary" id="sSave">保存</button></div>
      <div class="card" style="margin-top:14px"><h4>美术来源</h4><p>哈士喵（眼镜猫）立绘 8 差分、背景 10 张、情境 CG 8 张、BGM/音效 4 段，全部取自 github.com/604665656/hashimiao-quiz-avg 的现成素材，仅裁切重编码内嵌。单文件离线可玩，不依赖 CDN。</p></div>`;
    $$('#dBody [data-tog]').forEach(x=>x.onclick=()=>x.classList.toggle('on'));
    $$('#dBody [data-w]').forEach(x=>x.onclick=()=>{
      S.manualWeather=x.dataset.w; weather.kind=x.dataset.w; weather.live=false; save();
      $$('#dBody [data-w]').forEach(y=>y.classList.toggle('on',y===x)); renderHUD(); toast('天气已设为 '+x.dataset.w);
    });
    $('#sCancel').onclick=closeDrawer;
    $('#sLoc').onclick=()=>{ closeDrawer(); openLocationPicker(); };
    $('#sSave').onclick=()=>{
      S.settings.goal=clamp(Number($('#sGoal').value)||1700,500,4000);
      S.settings.interval=Number($('#sInterval').value);
      S.settings.checkinCooldown=clamp(Number($('#sCooldown').value)||30,1,120);
      $$('#dBody [data-tog]').forEach(x=>S.settings[x.dataset.tog]=x.classList.contains('on'));
      S.settings.llm={endpoint:$('#sEndpoint').value.trim(),key:$('#sKey').value.trim(),model:$('#sModel').value.trim()||'gpt-4o-mini'};
      S.lastRemindAt=Date.now(); save(); closeDrawer(); renderHUD();
      if(!S.settings.bgm&&audioEl){audioEl.pause();audioEl=null;curBgm='';}else bgm(curBgm||'轻快');
      fetchWeather(true);
      if(S.settings.notify&&'Notification'in window&&Notification.permission==='default')Notification.requestPermission();
      toast('设置已保存，喵');
    };
  }
}

/* ---------------- 快捷记录 / 弹层 ---------------- */
function openModal(html){ $('#modalBox').innerHTML=html; $('#mask').classList.add('show'); }
function closeModal(){ $('#mask').classList.remove('show'); }
$('#mask').addEventListener('click',e=>{ if(e.target.id==='mask')closeModal(); });
function openQuick(){
  openModal(`<div class="mtitle">💧 快捷记一笔</div><div class="msub">不打断剧情，直接写进今日流水</div>
    <div class="grid2" style="grid-template-columns:repeat(4,1fr)">
      ${[100,250,500,1500].map(v=>`<button class="btn" data-q="${v}" style="padding:14px 4px;font-size:12px">${v}<small style="display:block;font-size:9px;opacity:.7">ml</small></button>`).join('')}
    </div>
    <div class="field" style="margin-top:12px"><label>自定义 ml</label><input id="qCustom" type="number" min="1" max="3000" placeholder="比如 350"></div>
    <div class="btnrow"><button class="btn ghost" id="qClose">关闭</button><button class="btn primary" id="qOk">记下</button></div>`);
  $$('#modalBox [data-q]').forEach(x=>x.onclick=()=>{ quickWater(+x.dataset.q); closeModal(); });
  $('#qOk').onclick=()=>{ quickWater(Number($('#qCustom').value)); closeModal(); };
  $('#qClose').onclick=closeModal;
}
function quickWater(ml){
  ml=Math.round(Number(ml));
  if(!ml||ml<1||ml>3000){ toast('请输入 1~3000 之间的 ml'); return; }
  if(!guardCheckin()) return;
  today().logs.push({id:uid(),ts:Date.now(),ml,type:'water',note:'快捷记录 · 喝大水'});
  save(); renderHUD(); sfx('tick'); toast(`+${ml}ml 已记下，喵`);
  if(pctOf()>=1) setFace('揭晓');
}

/* ---------------- 事件 ---------------- */
$('#textbox').onclick=()=>{ if(typing) skipTyping(); };
$('#dClose').onclick=closeDrawer;
$('#drawer').addEventListener('click',e=>{ if(e.target.id==='drawer')closeDrawer(); });
$('#dTabs').addEventListener('click',e=>{ const t=e.target.dataset.t; if(t){ drawerTab=t; $$('#dTabs .dtab').forEach(x=>x.classList.toggle('on',x===e.target)); renderDrawer(); } });
$('#bDrawer').onclick=()=>openDrawer('图鉴');
$('#bQuick').onclick=openQuick;
$('#tAuto').onclick=e=>{ autoOn=!autoOn; e.target.classList.toggle('on',autoOn); toast(autoOn?'自动模式：开':'自动模式：关'); };
$('#tSkip').onclick=e=>{ skipOn=!skipOn; e.target.classList.toggle('on',skipOn); toast(skipOn?'跳过打字：开':'跳过打字：关'); };
$('#tLog').onclick=()=>{
  openModal(`<div class="mtitle">📜 对话历史</div><div class="msub">最近 ${history.length} 条</div>`+
    (history.length?history.slice(-30).reverse().map(h=>`<div class="qitem"><b>${esc(h.speaker)}：</b>${esc(h.text).replace(/\n/g,'<br>')}
      <time>${fmtTime(h.ts)}</time></div>`).join(''):'<div class="empty">还没有对话</div>')+
    `<div class="btnrow"><button class="btn ghost" id="hClose2">关闭</button></div>`);
  $('#hClose2').onclick=closeModal;
};
$('#tSave').onclick=()=>openDrawer('存档');
$('#tBoard').onclick=()=>openBoard();
$('#tShare').onclick=()=>openShareCard({mode:'daily',
  quote:(S.quoteBook[0]&&S.quoteBook[0].text)||localQuote(buildCtx()).text});
$('#pet').addEventListener('click',()=>{
  if($('#pet').dataset.moved==='1'){ $('#pet').dataset.moved='0'; return; }
  $('#pet').classList.remove('pat'); void $('#pet').offsetWidth; $('#pet').classList.add('pat');
  sfx('tick');
  const m=V.mood;
  setFace(rnd(['害羞','挥爪','揭晓']));
  say('哈士喵',rnd([
    '「喵？摸头可以，但大水不能少。」',
    '「本喵在值勤，喵。不过……可以摸一下下。」',
    `「${rnd(MOOD_WORD[m])}的时候，更要喝大水。」${rnd(CAT_TAIL)}`,
    '「弱者喝饮料，强者喝大水。摸完记得吨一口，喵。」'
  ]),null,()=>{ choices([{label:'回工位',ic:'↩',act:()=>goto(V.scene)}]); });
});
// 立绘可拖
(function(){
  const pet=$('#pet'); let sx=0,sy=0,ox=0,oy=0,drag=false;
  pet.addEventListener('pointerdown',e=>{
    drag=true; petDragged=true; pet.setPointerCapture(e.pointerId);
    const r=pet.getBoundingClientRect(), f=$('#frame').getBoundingClientRect();
    ox=r.left-f.left; oy=r.top-f.top; sx=e.clientX; sy=e.clientY;
    // 先把视觉位置固化成像素，再去掉居中 transform，避免拖动瞬间跳位
    pet.style.left=ox+'px'; pet.style.top=oy+'px';
    pet.style.bottom='auto'; pet.style.transform='none';
  });
  pet.addEventListener('pointermove',e=>{
    if(!drag)return;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>4)pet.dataset.moved='1';
    const f=$('#frame').getBoundingClientRect(), r=pet.getBoundingClientRect();
    pet.style.left=clamp(ox+dx,0,f.width-r.width)+'px';
    pet.style.top=clamp(oy+dy,0,f.height-r.height)+'px';
    pet.style.bottom='auto';
  });
  pet.addEventListener('pointerup',()=>{ drag=false; setTimeout(()=>pet.dataset.moved='0',80); });
  window.addEventListener('resize',()=>requestAnimationFrame(placePet));
})();
// 浏览器自动播放限制：首次交互后把被拦下的 BGM 重新拉起来
document.addEventListener('pointerdown',()=>{
  if(!S.settings.bgm) return;
  if(audioEl) audioEl.play().catch(()=>{});
  else bgm(curBgm||'轻快');
},{once:true});

document.addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='Enter'){ if($('#textbox')&&typing){e.preventDefault();skipTyping();} }
  if(e.key==='Escape'){ closeModal(); closeDrawer(); }
});

/* ---------------- 启动 ---------------- */
async function init(){
  ensureProfiles();
  V={clock:nowMin(),mood:S.settings.mood,trust:0,flags:{},scene:'intro'};
  setBG(BG.home,true); setFace('平静'); renderHUD();
  goto('intro'); requestAnimationFrame(placePet);
  initLocation();               // 先实时定位，取不到再让用户选省 / 市 / 区县
  tick();
  setInterval(tick,10000);
  setInterval(()=>renderHUD(),15000);   // 时钟跟着系统分钟走
  setInterval(()=>fetchWeather(),30*60*1000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ renderHUD(); tick(); } });
  if(!localStorage.getItem(KEY+'.greeted')){
    localStorage.setItem(KEY+'.greeted','1');
    setTimeout(()=>toast('点猫头可以摸摸 · 点顶部 📍 改位置 · 每 30 分钟喵会来提醒',4200),1400);
  }
}
init();
</script>
